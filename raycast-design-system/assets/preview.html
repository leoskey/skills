<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raycast-inspired Design System · 概念预览</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><style>
body{margin:0;background:#ECECF0;color:#24242C;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.page{max-width:1460px;margin:auto;padding:36px 40px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:26px}.head p{font-size:13px;color:#5A5A67;margin:8px 0 0}.head h1{font-size:30px;letter-spacing:-.5px;font-weight:500;line-height:1.3;margin:0}.head span{font:12px monospace;color:#676775}.themes{display:grid;grid-template-columns:1fr 1fr;gap:24px}.theme{min-width:0;border-radius:16px;border:1px solid var(--rc-border);overflow:hidden;padding:26px;box-shadow:0 5px 20px #0000000A}.theme-name{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--rc-text-secondary);padding-bottom:20px}.theme-name i{width:8px;height:8px;border-radius:50%;background:var(--rc-brand)}.theme-name span{margin-left:auto;font-family:var(--rc-font-mono);font-size:11px;color:var(--rc-text-tertiary)}.theme h2{font-size:26px;font-weight:500;line-height:1.4;letter-spacing:-.3px;margin:0 0 10px}.lede{font-size:14px;color:var(--rc-text-secondary);margin:0 0 24px;line-height:1.8}.command{padding:8px;background:var(--rc-surface);border:1px solid var(--rc-border);border-radius:12px}.search{padding:6px 6px 14px;border-bottom:1px solid var(--rc-border-subtle);margin-bottom:10px}.search .rc-input{border:0;background:transparent;padding-left:6px}.group-label{font-size:12px;color:var(--rc-text-tertiary);padding:4px 12px 8px}.rc-row{font-size:14px!important}.row-icon{height:26px;width:26px;border:1px solid var(--rc-border);border-radius:6px;display:grid;place-items:center;color:var(--rc-text-secondary);font:14px var(--rc-font-mono)}.row-meta{margin-left:auto;font-size:12px;color:var(--rc-text-tertiary)}.command-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 10px 5px;border-top:1px solid var(--rc-border-subtle);margin-top:8px;font-size:12px;color:var(--rc-text-secondary)}.key-group{display:flex;align-items:center;gap:5px}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.swatch div{height:42px;border-radius:6px;border:1px solid var(--rc-border)}.swatch p{margin:6px 0 0;font-size:12px;color:var(--rc-text-secondary)}.type{padding:20px 0;border-top:1px solid var(--rc-border-subtle);border-bottom:1px solid var(--rc-border-subtle)}.type p{margin:0 0 10px}.type p:last-child{margin:0}.caption{font-size:12px;color:var(--rc-text-tertiary)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:22px}.status{font-size:12px;color:var(--rc-text-secondary);min-height:20px;margin-top:12px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;color:var(--rc-text-tertiary);font-size:12px}.details b{display:block;color:var(--rc-text-secondary);font-size:14px;font-weight:500}.foot{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;margin-top:24px;font-size:12px;color:#5A5A67;line-height:1.7}.foot a{color:inherit}.rc-row[hidden]{display:none}.rc-button:focus-visible,.rc-row:focus-visible{outline-color:var(--rc-focus)}@media(max-width:900px){.page{padding:28px 20px}.themes{grid-template-columns:1fr}.head{display:block}.head>span{display:block;margin-top:14px}.theme{padding:22px}.row-meta{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main class="page"><header class="head"><div><h1>Raycast-inspired Design System</h1><p>中性表面 · 清晰排版 · 键盘优先</p></div><span>独立概念预览 / 示例内容</span></header><div class="themes" id="themes"></div><footer class="foot"><span>三项官方品牌色作为参考，其余为独立提炼值。此图不是 Raycast 原生应用截图。</span><span><a href="../references/sources.md">来源说明</a> · <a href="tokens.json">JSON Tokens</a></span></footer></main><script>
const themes=document.getElementById('themes');
for(const [name,title,subtitle] of [['dark','让工具退后，让工作向前。','Dark foundation'],['light','同一份秩序，更明亮的表面。','Light foundation']]){
 const section=document.createElement('section');section.className='theme rc-theme';section.dataset.theme=name;
 section.innerHTML=`<div class="theme-name"><i></i>${subtitle}<span>1.1 / DERIVED</span></div><h2>${title}</h2><p class="lede">克制的珊瑚红，稳定的内容层级。<br>用紧凑、清晰的组件组织日常任务。</p><div class="command"><div class="search"><input class="rc-input" aria-label="${name} 示例搜索" placeholder="搜索示例记录…" autocomplete="off"></div><div class="group-label">示例记录</div>${[['01','产品结构梳理','文档'],['02','键盘路径检查','检查'],['03','界面细节调整','记录']].map(([n,text,meta],i)=>`<button class="rc-row" type="button" aria-pressed="${i===0}"><span class="row-icon">${n}</span><span>${text}</span><span class="row-meta">${meta}</span></button>`).join('')}<div class="command-footer"><span>当前项保持中性选中态</span><span class="key-group">打开 <kbd class="rc-kbd">↵</kbd></span></div></div><div class="palette">${[['brand','Brand'],['bg','Background'],['surface','Surface'],['selected','Selected']].map(([key,label])=>`<div class="swatch"><div style="background:var(--rc-${key})"></div><p>${label}</p></div>`).join('')}</div><div class="type"><p style="font-size:20px;font-weight:500">精确的层级，自然的阅读。</p><p class="rc-reading">正文使用 15px 与舒展的行高，<strong>局部强调 500 字重</strong>。减少小字，让内容更容易被读懂。</p><p class="caption">辅助信息 12px · 不以过暗文字换取视觉安静</p></div><div class="actions"><button type="button" class="rc-button rc-button--primary">创建示例</button><button type="button" class="rc-button">查看详情</button><button type="button" class="rc-button" disabled>暂不可用</button></div><div class="status" role="status" aria-live="polite">可输入关键词筛选；按钮仅演示交互反馈。</div><div class="details"><div><b>36 / 44px</b>控件 / 列表起点</div><div><b>6–16px</b>分层圆角</div><div><b>120–240ms</b>状态与浮层</div></div>`;
 const rows=[...section.querySelectorAll('.rc-row')],status=section.querySelector('.status'),input=section.querySelector('input');
 rows.forEach(row=>row.addEventListener('click',()=>{rows.forEach(r=>r.setAttribute('aria-pressed',String(r===row)));status.textContent='当前示例：'+row.children[1].textContent;}));
 input.addEventListener('input',()=>{let count=0;for(const row of rows){row.hidden=!row.textContent.includes(input.value.trim());if(!row.hidden)count++;}status.textContent=count?`找到 ${count} 条示例记录`:'没有匹配示例；清空关键词可恢复。';});
 section.querySelectorAll('.actions button:not(:disabled)').forEach(b=>b.addEventListener('click',()=>{status.textContent='概念演示：'+b.textContent+'，未连接业务服务。';}));
 themes.append(section);
}
</script></body></html>
