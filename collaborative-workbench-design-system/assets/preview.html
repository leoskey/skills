<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>协作工作台 · 原创概念预览</title><link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select,input{min-height:40px;border:1px solid var(--cwb-control);border-radius:var(--cwb-radius);background:var(--cwb-surface);color:var(--cwb-text);padding:7px 12px}button,select{cursor:pointer}button:hover{background:var(--cwb-selected)}:focus-visible{outline:3px solid var(--cwb-accent);outline-offset:3px}button:disabled{cursor:default;color:var(--cwb-muted);opacity:.7}.primary{background:var(--cwb-accent);color:var(--cwb-onAccent);border-color:var(--cwb-accent)}.primary:hover{background:var(--cwb-accent);filter:brightness(.94)}.skip{position:absolute;top:-100px;left:16px;background:var(--cwb-surface);color:var(--cwb-text);padding:12px;z-index:9}.skip:focus{top:8px}
.app{min-height:100vh;display:grid;grid-template-columns:208px minmax(0,1fr)}aside{padding:28px 16px;border-right:1px solid var(--cwb-border)}.identity{font-size:18px;font-weight:650;margin:0 0 36px}.small,small{font-size:13px;color:var(--cwb-muted)}.scope{display:grid;gap:8px}select{width:100%}.aside-note{margin-top:40px;color:var(--cwb-muted);font-size:13px}main{min-width:0}.top{padding:24px 32px;border-bottom:1px solid var(--cwb-border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.top p{margin:0;color:var(--cwb-muted);font-size:13px}h1{font-size:24px;line-height:1.3;margin:0 0 6px}h2{font-size:20px;line-height:1.5;margin:8px 0 16px;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.workspace{display:grid;grid-template-columns:minmax(320px,1fr) minmax(300px,.85fr);min-height:calc(100vh - 108px)}.collection{padding:24px 24px 32px;min-width:0}.toolbar{display:flex;align-items:end;gap:8px}.search{flex:1;min-width:0}.search label{display:block;font-size:13px;color:var(--cwb-muted);margin-bottom:4px}.search input{width:100%;min-width:0}.count{font-size:13px;color:var(--cwb-muted);margin:16px 0 8px}ul{padding:0;list-style:none;margin:0}.record{width:100%;text-align:left;display:grid;gap:8px;padding:18px 12px;border:0;border-bottom:1px solid var(--cwb-border);border-radius:0;background:transparent}.record[aria-current="true"]{background:var(--cwb-selected);box-shadow:inset 3px 0 var(--cwb-accent)}.record strong{font-size:15px;font-weight:600;overflow-wrap:anywhere}.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--cwb-muted)}.status{color:var(--cwb-warning);font-weight:600}.status.done{color:var(--cwb-success)}.detail{padding:24px 28px;background:var(--cwb-surface);border-left:1px solid var(--cwb-border);min-width:0}.detail dl{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;font-size:13px;margin:24px 0}.detail dt{color:var(--cwb-muted)}.detail dd{margin:0;overflow-wrap:anywhere}.section{border-top:1px solid var(--cwb-border);padding-top:20px;margin-top:24px}.section h3{font-size:15px;margin:0 0 10px}.section p{font-size:14px;color:var(--cwb-muted);max-width:65ch}.back{display:none;margin-bottom:12px}.message{margin-top:24px;font-size:13px;color:var(--cwb-muted);min-height:24px}.empty{padding:32px 12px;color:var(--cwb-muted)}dialog{width:min(480px,calc(100% - 32px));padding:24px;border:1px solid var(--cwb-control);border-radius:10px;background:var(--cwb-surface);color:var(--cwb-text)}dialog::backdrop{background:#0008}dialog label{display:block;margin:16px 0 6px}dialog input{width:100%}dialog .actions{margin-top:24px;justify-content:flex-end}.error{color:var(--cwb-danger);font-size:13px;margin:6px 0} [hidden]{display:none!important}
@media(max-width:1100px){.app{grid-template-columns:1fr}aside{padding:12px 24px;display:flex;gap:24px;align-items:center;border-right:0;border-bottom:1px solid var(--cwb-border)}.identity{margin:0}.scope{display:flex;align-items:center;gap:12px;flex:1}.scope label{white-space:nowrap}.scope select{max-width:240px}.aside-note{display:none}}
@media(max-width:720px){aside{padding:12px 16px;display:block}.identity{font-size:15px;margin-bottom:8px}.top{padding:20px 16px}.workspace{display:block;min-height:0}.collection,.detail{padding:20px 16px}.detail{display:none;border:0}.workspace.show-detail .collection{display:none}.workspace.show-detail .detail{display:block}.back{display:inline-block}.toolbar{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.app{align-content:start}
@media(max-width:720px){.back{display:block;width:fit-content}}
</style></head>
<body class="cwb" data-theme="light"><a class="skip" href="#main">跳到工作内容</a><div class="app">
<aside><p class="identity">协作工作台</p><div class="scope"><label class="small" for="scope">工作范围</label><select id="scope"><option value="all">全部记录</option><option value="pending">待处理</option><option value="done">已完成</option></select></div><p class="aside-note">原创概念预览<br>以下内容均为演示数据。<br>刷新页面将恢复初始内容。</p></aside>
<main id="main"><header class="top"><div><h1>工作记录</h1><p>原创概念预览 · 数据仅在当前页面内存中</p></div><div class="actions"><button id="theme" aria-pressed="false">深色主题</button><button id="create" class="primary">创建记录</button></div></header>
<div class="workspace" id="workspace"><section class="collection" aria-label="记录集合"><div class="toolbar"><div class="search"><label for="query">搜索记录标题</label><input id="query" type="search" autocomplete="off" placeholder="输入关键词…"></div><button id="clear">清除</button></div><p id="count" class="count" role="status"></p><ul id="records"></ul><p id="empty" class="empty" hidden>没有匹配的记录。清除搜索或更换工作范围后重试。</p></section>
<section class="detail" aria-labelledby="detail-title"><button id="back" class="back">返回记录列表</button><span class="small" id="record-id"></span><h2 id="detail-title" tabindex="-1"></h2><span id="detail-status" class="status"></span><dl><dt>执行者</dt><dd id="owner"></dd><dt>最近更新</dt><dd id="updated"></dd></dl><div class="section"><h3>上下文</h3><p id="description"></p></div><div class="section"><h3>下一步</h3><p>核对内容后更新记录状态。此操作仅演示页面内状态变化。</p><button id="complete" class="primary">标记完成</button></div><p id="message" class="message" role="status"></p></section></div>
<dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><form id="form" novalidate><h2 id="dialog-title">创建记录</h2><p id="dialog-description" class="small">仅创建演示记录，刷新后不会保留。</p><label for="title">标题（必填）</label><input id="title" name="title" required maxlength="160" autocomplete="off" aria-describedby="error"><p id="error" class="error" hidden>请输入记录标题。</p><div class="actions"><button id="cancel" type="button">取消</button><button type="submit" class="primary">创建记录</button></div></form></dialog>
</main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const rows=[{id:1,title:'核对共享资料的访问说明',owner:'人员 · 演示成员',description:'检查说明是否包含访问范围、责任人与下一步入口，确保新成员能够独立找到需要的信息。',done:false},{id:2,title:'整理自动化执行后的待处理事项与结果说明',owner:'自动化 · 演示助手',description:'演示自动化执行者的身份表达。自动化类型不代表审批权限；实际产品应读取服务端授权。',done:false},{id:3,title:'完成集合页的长内容复核',owner:'人员 · 演示成员',description:'核对标题换行、搜索空结果与窄屏返回路径。此记录为虚构演示数据。',done:true}];
let selected=1;
function setTheme(dark){document.body.dataset.theme=dark?'dark':'light';$('theme').setAttribute('aria-pressed',String(dark));$('theme').textContent=dark?'浅色主题':'深色主题'}
setTheme(matchMedia('(prefers-color-scheme: dark)').matches);
$('theme').onclick=()=>setTheme(document.body.dataset.theme!=='dark');
function render(){const q=$('query').value.trim().toLocaleLowerCase(),scope=$('scope').value;const matches=rows.filter(r=>r.title.toLocaleLowerCase().includes(q)&&(scope==='all'||r.done===(scope==='done')));$('records').replaceChildren();for(const r of matches){const li=document.createElement('li'),b=document.createElement('button'),t=document.createElement('strong'),m=document.createElement('span'),s=document.createElement('span'),o=document.createElement('span');b.className='record';b.dataset.id=r.id;b.setAttribute('aria-current',String(r.id===selected));t.textContent=r.title;m.className='meta';s.className='status'+(r.done?' done':'');s.textContent=r.done?'已完成':'待处理';o.textContent=r.owner;m.append(s,o);b.append(t,m);b.onclick=()=>{selected=r.id;render();if(matchMedia('(max-width:720px)').matches){$('workspace').classList.add('show-detail');$('detail-title').focus()}};li.append(b);$('records').append(li)}$('count').textContent=`${matches.length} 条记录`;$('empty').hidden=matches.length>0;const r=rows.find(r=>r.id===selected);$('record-id').textContent=`记录 ${String(r.id).padStart(3,'0')}`;$('detail-title').textContent=r.title;$('detail-status').textContent=r.done?'已完成':'待处理';$('detail-status').className='status'+(r.done?' done':'');$('owner').textContent=r.owner;$('updated').textContent=r.updated||'演示初始状态';$('description').textContent=r.description;$('complete').disabled=r.done;$('complete').textContent=r.done?'已完成':'标记完成'}
$('query').addEventListener('input',render);$('scope').onchange=render;$('clear').onclick=()=>{$('query').value='';$('scope').value='all';render();$('query').focus()};
$('back').onclick=()=>{$('workspace').classList.remove('show-detail');document.querySelector(`[data-id="${selected}"]`)?.focus()};
$('complete').onclick=()=>{const r=rows.find(r=>r.id===selected);r.done=true;r.updated='刚刚 · 页面内更新';render();$('message').textContent='已标记完成；刷新后恢复演示状态。'};
$('create').onclick=()=>{if(typeof $('dialog').showModal!=='function'){$('message').textContent='当前浏览器不支持演示对话框，请使用支持 dialog 的浏览器。';return}$('form').reset();$('error').hidden=true;$('title').removeAttribute('aria-invalid');$('dialog').showModal();$('title').focus()};
$('cancel').onclick=()=>$('dialog').close();$('dialog').addEventListener('close',()=>$('create').focus());
$('dialog').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const controls=[...$('dialog').querySelectorAll('input,button')].filter(el=>!el.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('error').hidden=false;$('title').setAttribute('aria-invalid','true');$('title').focus();return}selected=rows.length+1;rows.unshift({id:selected,title,owner:'人员 · 演示成员',description:'新建的页面内演示记录。接入业务时应替换为真实数据来源与权限。',done:false});$('query').value='';$('scope').value='all';render();$('dialog').close();$('message').textContent='演示记录已创建；刷新后不保留。';if(matchMedia('(max-width:720px)').matches){$('workspace').classList.add('show-detail');$('detail-title').focus()}};
render();
</script></body></html>
